name: Deploy Templates

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Prepare the deployment folder by copying the necessary template folders and README
      - name: Prepare Deployment Folder
        run: |
          mkdir out
          
          # Замініть назви нижче на реальні назви ваших папок
          cp -r template_1 out/
          cp -r template_2 out/
          cp -r template_3 out/
          cp -r template_4 out/
          cp -r template_5 out/
          
          # Копіюємо README, щоб він теж був доступний
          cp README.md out/ 2>/dev/null || echo "No README"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4